<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App - Home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      color: #333;
      margin-bottom: 12px;
    }
    p {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-jogar {
      display: inline-block;
      padding: 12px 24px;
      background-color: #2ecc71;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.2s ease;
    }
    .btn-jogar:hover {
      background-color: #27ae60;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Bem-vindo ao App</h1>
    <p>Clique no botão abaixo para iniciar o jogo em tela cheia desenvolvido com Phaser.</p>
    <a href="jogo.html" class="btn-jogar">Jogar Agora</a>
  </div>

</body>
</html>
